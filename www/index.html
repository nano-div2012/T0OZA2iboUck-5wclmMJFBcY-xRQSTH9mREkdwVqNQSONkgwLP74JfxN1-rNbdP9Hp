<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <meta name="application-id" content="com.jull.jull.jull">
    <meta name="package-name" content="com.jull.jull.jull">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: file: https: http:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; connect-src 'self' https: http:; frame-src 'self' https: http:;">
    <title>floating jull</title>
    <style>
        /* =====================================================
           floating jull - "Aurora Premium" Theme
           ===================================================== */
        :root {
            --bg-base: #0a0e27;
            --bg-deep: #050818;
            --surface-1: rgba(15, 23, 42, 0.88);
            --surface-2: rgba(15, 23, 42, 0.78);
            --surface-3: rgba(30, 41, 59, 0.65);

            --primary: #7C3AED;
            --primary-hover: #8B5CF6;
            --primary-glow: rgba(124, 58, 237, 0.45);

            --accent: #22D3EE;
            --accent-hover: #67E8F9;
            --accent-glow: rgba(34, 211, 238, 0.45);

            --secondary: #EC4899;
            --tertiary: #10B981;

            --danger: #EF4444;
            --danger-glow: rgba(239, 68, 68, 0.45);

            --text-primary: #F1F5F9;
            --text-secondary: rgba(241, 245, 249, 0.72);
            --text-tertiary: rgba(241, 245, 249, 0.52);
            --text-on-primary: #FFFFFF;

            --border-subtle: rgba(241, 245, 249, 0.1);
            --border-accent: rgba(34, 211, 238, 0.3);
            --border-primary: rgba(124, 58, 237, 0.35);

            --shadow-window: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --shadow-window-active: 0 24px 64px rgba(0, 0, 0, 0.75), 0 0 0 1px var(--accent-glow), 0 0 32px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            --shadow-taskbar: 0 -4px 32px rgba(0, 0, 0, 0.55), 0 -1px 0 rgba(34, 211, 238, 0.18);

            --radius-window: 14px;
            --radius-card: 12px;
            --radius-pill: 999px;

            --ease-premium: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', 'Inter', 'Noto Sans', system-ui, sans-serif;
            color: var(--text-primary);
            background: var(--bg-base);
            font-size: 14px;
            line-height: 1.45;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        /* BOOT SCREEN */
        #boot-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(34, 211, 238, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.25) 0%, transparent 50%),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-deep) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s var(--ease-premium);
        }

        #boot-screen.fade-out { opacity: 0; pointer-events: none; }

        .boot-logo {
            animation: bootPulse 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 24px var(--accent-glow)) drop-shadow(0 0 16px var(--primary-glow));
        }

        .boot-name {
            margin-top: 28px;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-shadow: 0 0 16px var(--accent-glow), 0 0 32px var(--primary-glow);
        }

        .boot-spinner {
            margin-top: 32px;
            width: 36px;
            height: 36px;
            border: 2px solid rgba(34, 211, 238, 0.15);
            border-top-color: var(--accent);
            border-right-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        @keyframes bootPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* DESKTOP */
        #desktop {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(124, 58, 237, 0.22) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 80% 30%, rgba(34, 211, 238, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 50% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 60%),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-deep) 50%, var(--bg-base) 100%);
            overflow: hidden;
        }

        #desktop::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 25% 35%, rgba(255, 255, 255, 0.05) 1px, transparent 1.5px),
                radial-gradient(circle at 75% 65%, rgba(34, 211, 238, 0.05) 1px, transparent 1.5px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }

        #desktop-default-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            opacity: 0.9;
        }

        #desktop-default-watermark .watermark-main {
            font-size: 38px;
            font-weight: 800;
            color: #22D3EE;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.6), 0 0 40px rgba(124, 58, 237, 0.35);
        }

        #desktop-default-watermark .watermark-sub {
            font-size: 12px;
            color: rgba(241, 245, 249, 0.55);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* DESKTOP ICONS */
        #desktop-icons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1;
        }

        .desktop-icon {
            width: 82px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s var(--ease-premium), transform 0.15s var(--ease-premium);
        }

        .desktop-icon:hover { background: rgba(34, 211, 238, 0.08); }
        .desktop-icon:active { background: rgba(34, 211, 238, 0.2); transform: scale(0.95); }

        .desktop-icon .icon-img {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.2s var(--ease-premium), box-shadow 0.2s var(--ease-premium);
        }

        .desktop-icon:hover .icon-img {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
        }

        .icon-label {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-primary);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            word-break: break-word;
            line-height: 1.15;
        }

        @media (max-width: 380px) {
            #desktop-icons { flex-direction: row; flex-wrap: wrap; max-width: calc(100vw - 32px); }
            .desktop-icon { width: 70px; height: 78px; }
        }

        /* WINDOWS */
        #windows-container {
            position: absolute;
            inset: 0;
            bottom: 64px;
            pointer-events: none;
            z-index: 20;
        }

        .window {
            position: absolute;
            background: var(--surface-1);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-window);
            box-shadow: var(--shadow-window);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
            min-width: 280px;
            min-height: 200px;
            animation: windowOpen 0.24s var(--ease-out-back);
        }

        .window.active {
            box-shadow: var(--shadow-window-active);
            border-color: rgba(34, 211, 238, 0.35);
        }

        @keyframes windowOpen {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .window.closing { animation: windowClose 0.18s var(--ease-premium) forwards; }
        @keyframes windowClose { to { opacity: 0; transform: scale(0.94) translateY(8px); } }

        .window.minimized {
            opacity: 0;
            transform: scale(0.5) translateY(120px);
            pointer-events: none;
            transition: opacity 0.24s, transform 0.24s;
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
        }

        .window-titlebar {
            height: 40px;
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.22) 0%, rgba(34, 211, 238, 0.08) 100%);
            border-bottom: 1px solid rgba(34, 211, 238, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 0 14px;
            cursor: grab;
            flex-shrink: 0;
            touch-action: none;
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .window-icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .window-title-text { overflow: hidden; text-overflow: ellipsis; }
        .window-controls { display: flex; gap: 2px; }

        .window-btn {
            width: 36px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .window-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .window-btn.window-close:hover { background: var(--danger); color: #fff; }

        .window-body {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            background: rgba(10, 14, 39, 0.45);
        }

        .window-resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 24px;
            height: 24px;
            cursor: nwse-resize;
            z-index: 50;
            background: linear-gradient(135deg, transparent 50%, var(--accent) 50%, var(--accent) 60%, transparent 60%, transparent 70%, var(--accent) 70%, var(--accent) 80%, transparent 80%);
            opacity: 0.6;
            touch-action: none;
        }

        .window.maximized .window-resize-handle { display: none; }

        /* =====================================================
           FLOATING BUBBLE & AI + GOOGLE ACTION MENU
           ===================================================== */
        #floating-bubble-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 500;
        }

        #floating-bubble {
            position: fixed;
            right: 22px;
            bottom: 92px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #22D3EE 0%, #7C3AED 100%);
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 24px rgba(34, 211, 238, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            touch-action: none;
            z-index: 510;
            transition: box-shadow 0.2s var(--ease-premium), transform 0.18s var(--ease-out-back);
        }

        #floating-bubble:active { cursor: grabbing; transform: scale(0.95); }

        #floating-bubble.shape-circle { border-radius: 50%; }
        #floating-bubble.shape-square { border-radius: 6px; }
        #floating-bubble.shape-rounded { border-radius: 18px; }
        #floating-bubble.shape-triangle {
            background: transparent;
            border: none;
            box-shadow: none;
            width: 66px;
            height: 60px;
        }

        #floating-bubble .bubble-shine {
            position: absolute;
            top: 7px;
            left: 11px;
            width: 14px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            transform: rotate(-28deg);
            pointer-events: none;
        }

        #floating-bubble.shape-triangle .bubble-shine { display: none; }

        #floating-bubble .bubble-badge {
            position: relative;
            z-index: 2;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* Floating Action Menu (AI & Google Options) */
        #floating-action-menu {
            position: fixed;
            width: 296px;
            max-width: calc(100vw - 24px);
            background: rgba(10, 14, 39, 0.96);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(34, 211, 238, 0.35);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 32px rgba(34, 211, 238, 0.25);
            padding: 14px;
            pointer-events: auto;
            z-index: 520;
            animation: menuPop 0.18s var(--ease-out-back);
        }

        @keyframes menuPop {
            from { opacity: 0; transform: scale(0.92) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .fam-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .fam-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .fam-close {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }

        .fam-close:hover { background: var(--danger); color: #fff; }

        .fam-input-wrap {
            margin-bottom: 10px;
        }

        .fam-input {
            width: 100%;
            padding: 9px 11px;
            border-radius: 10px;
            border: 1px solid rgba(34, 211, 238, 0.28);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            font-size: 12.5px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .fam-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.18);
        }

        .fam-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .fam-option-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: transform 0.14s var(--ease-premium), background 0.14s var(--ease-premium), border-color 0.14s var(--ease-premium);
        }

        .fam-option-btn:hover {
            background: rgba(34, 211, 238, 0.12);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .fam-option-btn.ai-mode {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.22), rgba(34, 211, 238, 0.14));
            border-color: rgba(139, 92, 246, 0.5);
        }

        .fam-option-btn.ai-mode:hover {
            border-color: #A78BFA;
            box-shadow: 0 0 16px rgba(124, 58, 237, 0.35);
        }

        .fam-option-btn.google-mode {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(16, 185, 129, 0.12));
            border-color: rgba(34, 211, 238, 0.45);
        }

        .fam-opt-badge {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        .fam-opt-desc {
            font-size: 10.5px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .fam-secondary-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .fam-mini-btn {
            flex: 1;
            padding: 7px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .fam-mini-btn:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.12);
        }

        /* SHARED UI & SETTINGS */
        .app-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; color: var(--text-primary); }
        .bs-scroll { flex: 1; overflow-y: auto; padding: 16px; }
        .bs-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 14px;
            margin-bottom: 12px;
        }
        .bs-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .bs-status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bs-control-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .bs-shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .bs-shape {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
        }
        .bs-shape.active {
            background: rgba(34, 211, 238, 0.18);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .bs-shape-preview {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .bs-shape-circle { border-radius: 50%; }
        .bs-shape-square { border-radius: 0; }
        .bs-shape-rounded { border-radius: 8px; }
        .bs-shape-triangle {
            background: none; border: none; width: 0; height: 0;
            border-left: 16px solid transparent; border-right: 16px solid transparent;
            border-bottom: 28px solid var(--accent);
        }

        .bs-section-accent {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.06), rgba(124, 58, 237, 0.06));
            border: 1px solid rgba(34, 211, 238, 0.25);
        }
        .bs-color-row { display: flex; align-items: center; gap: 10px; }
        .bs-color-swatch-accent { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--accent); flex-shrink: 0; }
        .bs-color-val { flex: 1; font-size: 12px; font-family: monospace; }
        .bs-color-palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
        .bs-color-chip { aspect-ratio: 1; border-radius: 8px; cursor: pointer; padding: 2px; border: 1px solid rgba(255,255,255,0.2); }
        .bs-chip-inner { width: 100%; height: 100%; border-radius: 6px; }

        .bs-slider-row { display: flex; align-items: center; gap: 12px; }
        .bs-slider { flex: 1; accent-color: var(--accent); height: 4px; }
        .bs-slider-val { min-width: 50px; text-align: right; font-size: 12px; }
        .bs-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; line-height: 1.5; }

        .bs-feature-toggles { display: flex; flex-direction: column; gap: 8px; }
        .bs-feature-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: rgba(255, 255, 255, 0.04); border-radius: 10px; font-size: 13px;
        }
        .bs-feature-label { display: flex; align-items: center; gap: 10px; }
        .bs-toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
        .bs-toggle input { opacity: 0; width: 0; height: 0; }
        .bs-toggle-slider {
            position: absolute; cursor: pointer; inset: 0;
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-accent);
            border-radius: 14px; transition: 0.25s;
        }
        .bs-toggle-slider::before {
            content: ""; position: absolute; height: 18px; width: 18px; left: 2px; bottom: 2px;
            background: var(--text-primary); border-radius: 50%; transition: 0.25s;
        }
        .bs-toggle input:checked + .bs-toggle-slider { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .bs-toggle input:checked + .bs-toggle-slider::before { transform: translateX(20px); background: #fff; }

        .btn {
            background: rgba(34, 211, 238, 0.12);
            border: 1px solid rgba(34, 211, 238, 0.3);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
            font-weight: 500;

    <script>
    /* =====================================================
       floating jull - Core, Bubble & UI Logic
       ===================================================== */
    const APP_INFO = {
        appName: 'floating jull',
        version: '3.1.0'
    };

    function notify(message, duration = 2400) {
        const container = document.getElementById('notifications');
        if (!container) return;
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = message;
        container.appendChild(notif);
        setTimeout(() => notif.remove(), duration);
    }

    /* ---------- Window Manager ---------- */
    const WindowManager = (function() {
        const container = () => document.getElementById('windows-container');
        const taskbarApps = () => document.getElementById('taskbar-apps');
        const windows = new Map();
        let zIndex = 100;
        let activeId = null;
        let nextId = 1;
        const listeners = { focus: [], close: [], minimize: [] };

        function emit(event, payload) {
            (listeners[event] || []).forEach(fn => {
                try { fn(payload); } catch (e) { console.error(e); }
            });
        }
        function on(event, fn) {
            if (!listeners[event]) listeners[event] = [];
            listeners[event].push(fn);
        }

        function createWindow(config) {
            const id = config.id || ('win-' + nextId++);
            if (config.singleInstance !== false && windows.has(id)) {
                const existing = windows.get(id);
                if (existing.state === 'minimized') restoreWindow(id);
                focusWindow(id);
                if (config.onReady) {
                    const body = existing.el.querySelector('.window-body');
                    requestAnimationFrame(() => config.onReady(body, id));
                }
                return id;
            }

            const tpl = document.getElementById('window-template');
            const frag = tpl.content.cloneNode(true);
            const winEl = frag.querySelector('.window');

            const width = config.width || Math.min(390, window.innerWidth - 24);
            const height = config.height || Math.min(540, window.innerHeight - 90);
            const offset = (windows.size % 5) * 18;
            const x = Math.max(8, Math.min(window.innerWidth - width - 8, (window.innerWidth - width) / 2 + offset));
            const y = Math.max(12, Math.min(window.innerHeight - height - 72, (window.innerHeight - height - 64) / 2 + offset));

            winEl.style.left = x + 'px';
            winEl.style.top = y + 'px';
            winEl.style.width = width + 'px';
            winEl.style.height = height + 'px';
            winEl.style.zIndex = ++zIndex;

            winEl.querySelector('.window-title-text').textContent = config.title || 'Window';
            if (config.iconHtml) winEl.querySelector('.window-icon').innerHTML = config.iconHtml;

            const body = winEl.querySelector('.window-body');
            if (typeof config.content === 'string') body.innerHTML = config.content;

            winEl.querySelector('.window-close').addEventListener('click', (e) => { e.stopPropagation(); closeWindow(id); });
            winEl.querySelector('.window-minimize').addEventListener('click', (e) => { e.stopPropagation(); minimizeWindow(id); });
            winEl.querySelector('.window-maximize').addEventListener('click', (e) => { e.stopPropagation(); toggleMaximize(id); });

            const titlebar = winEl.querySelector('.window-titlebar');
            winEl.addEventListener('pointerdown', () => focusWindow(id), true);
            makeDraggable(winEl, titlebar, id);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'window-resize-handle';
            winEl.appendChild(resizeHandle);
            makeResizable(winEl, resizeHandle, id);

            container().appendChild(winEl);

            const taskbarEl = document.createElement('div');
            taskbarEl.className = 'taskbar-app';
            taskbarEl.innerHTML = config.iconHtml || '';
            taskbarEl.addEventListener('click', () => {
                const w = windows.get(id);
                if (!w) return;
                if (w.state === 'minimized') restoreWindow(id);
                else if (activeId === id) minimizeWindow(id);
                else focusWindow(id);
            });
            taskbarApps().appendChild(taskbarEl);

            windows.set(id, { el: winEl, state: 'normal', taskbarEl, prevRect: null });
            focusWindow(id);

            if (config.onReady) requestAnimationFrame(() => config.onReady(body, id));
            return id;
        }

        function makeDraggable(winEl, handle, id) {
            let startX, startY, startLeft, startTop, dragging = false;
            handle.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.window-btn') || winEl.classList.contains('maximized')) return;
                dragging = true;
                startX = e.clientX; startY = e.clientY;
                startLeft = parseInt(winEl.style.left, 10) || 0;
                startTop = parseInt(winEl.style.top, 10) || 0;
                focusWindow(id);
                handle.setPointerCapture(e.pointerId);
            });
            handle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                winEl.style.left = (startLeft + e.clientX - startX) + 'px';
                winEl.style.top = Math.max(0, startTop + e.clientY - startY) + 'px';
            });
            handle.addEventListener('pointerup', () => { dragging = false; });
        }

        function makeResizable(winEl, handle, id) {
            let startX, startY, startW, startH, resizing = false;
            handle.addEventListener('pointerdown', (e) => {
                if (winEl.classList.contains('maximized')) return;
                resizing = true;
                startX = e.clientX; startY = e.clientY;
                startW = winEl.offsetWidth; startH = winEl.offsetHeight;
                focusWindow(id);
                handle.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });
            handle.addEventListener('pointermove', (e) => {
                if (!resizing) return;
                winEl.style.width = Math.max(260, startW + e.clientX - startX) + 'px';
                winEl.style.height = Math.max(200, startH + e.clientY - startY) + 'px';
            });
            handle.addEventListener('pointerup', () => { resizing = false; });
        }

        function focusWindow(id) {
            activeId = id;
            windows.forEach((w, wid) => {
                if (wid === id) {
                    w.el.style.zIndex = ++zIndex;
                    w.el.classList.add('active');
                    w.taskbarEl.classList.add('active');
                } else {
                    w.el.classList.remove('active');
                    w.taskbarEl.classList.remove('active');
                }
            });
            emit('focus', id);
        }

        function closeWindow(id) {
            const w = windows.get(id);
            if (!w) return;
            w.el.classList.add('closing');
            setTimeout(() => {
                w.el.remove();
                w.taskbarEl.remove();
                windows.delete(id);
                if (activeId === id) {
                    activeId = null;
                    emit('focus', null);
                }
                emit('close', id);
            }, 150);
        }

        function minimizeWindow(id) {
            const w = windows.get(id);
            if (!w) return;
            w.state = 'minimized';
            w.el.classList.add('minimized');
            w.taskbarEl.classList.remove('active');
            if (activeId === id) { activeId = null; emit('focus', null); }
            emit('minimize', id);
        }

        function restoreWindow(id) {
            const w = windows.get(id);
            if (!w) return;
            w.state = w.el.classList.contains('maximized') ? 'maximized' : 'normal';
            w.el.classList.remove('minimized');
            focusWindow(id);
        }

        function toggleMaximize(id) {
            const w = windows.get(id);
            if (!w) return;
            if (w.el.classList.contains('maximized')) {
                w.el.classList.remove('maximized');
                if (w.prevRect) Object.assign(w.el.style, w.prevRect);
                w.state = 'normal';
            } else {
                w.prevRect = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
                w.el.classList.add('maximized');
                w.state = 'maximized';
            }
            focusWindow(id);
        }

        return {
            create: createWindow,
            close: closeWindow,
            closeAll: () => Array.from(windows.keys()).forEach(closeWindow),
            activeId: () => activeId,
            on
        };
    })();

        iconHtml: '<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="8" r="1.5" fill="#fff"/><path d="M11 11h2v7h-2z" fill="#fff"/></svg>',
        title: 'Tentang floating jull',
        open() {

                <div class="app-content" style="padding:24px 20px;overflow-y:auto;">

                        <h2 style="margin:0 0 4px;font-size:22px;color:#22D3EE;">${APP_INFO.appName}</h2>

                            • Nama Aplikasi: <strong>${APP_INFO.appName}</strong><br>

                        </div>
                    </div>

            `;
            return WindowManager.create({ id: 'tentang', title: this.title, iconHtml: this.iconHtml, content });
        }
    };

    Apps.carapasang = {
        iconHtml: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="5" width="20" height="14" rx="3" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><path d="M10 9l6 3-6 3z" fill="#fff"/></svg>',
        title: 'Cara Pasang',
        open() {
            const content = `
                <div class="app-content" style="padding:16px;overflow-y:auto;">
                    <h2 style="margin:0 0 8px;font-size:18px;color:#22D3EE;text-align:center;">Panduan Penggunaan ${APP_INFO.appName}</h2>
                    <p style="margin:0 0 14px;font-size:12px;opacity:0.8;text-align:center;">
                        Langkah cepat menggunakan Floating Bubble dan opsi AI / Google:
                    </p>
                    <div class="bs-section" style="font-size:12px;line-height:1.8;">
                        1. Tombol <strong>JULL</strong> mengambang sudah muncul di pojok kanan bawah layar (atau klik ikon bubble di taskbar).<br>
                        2. <strong>Ketuk</strong> bubble untuk memunculkan menu pilihan <strong>Tanya AI</strong>, <strong>AI Ringkas / Jelaskan</strong>, <strong>Google Search</strong>, atau <strong>Google + AI Mode</strong>.<br>
                        3. <strong>Geser (drag)</strong> bubble ke posisi mana saja di layar.<br>
                        4. Buka <strong>floating jull Bubble</strong> untuk mengubah bentuk, warna, opasitas, atau ukuran bubble.
                    </div>
                </div>
            `;
            return WindowManager.create({ id: 'carapasang', title: this.title, iconHtml: this.iconHtml, content });
        }
    };

    window.AppRegistry = Apps;

    /* ---------- Floating Bubble Controller ---------- */
    const FloatingBubbleController = (function() {
        const bubbleEl = () => document.getElementById('floating-bubble');
        const menuEl = () => document.getElementById('floating-action-menu');
        const queryInput = () => document.getElementById('fam-query-input');

        let isDragging = false;
        let movedDuringDrag = false;
        let startX = 0, startY = 0, startLeft = 0, startTop = 0;

        function ensurePositioned() {
            const b = bubbleEl();
            if (!b) return;
            if (!b.style.left || !b.style.top) {
                const rect = b.getBoundingClientRect();
                const left = rect.left || Math.max(16, window.innerWidth - 82);
                const top = rect.top || Math.max(16, window.innerHeight - 152);
                b.style.right = 'auto';
                b.style.bottom = 'auto';
                b.style.left = left + 'px';
                b.style.top = top + 'px';
            }
        }

        function applyConfig(cfg) {
            const b = bubbleEl();
            if (!b || !cfg) return;

            b.classList.toggle('hidden', cfg.visible === false);
            b.classList.remove('shape-circle', 'shape-square', 'shape-rounded', 'shape-triangle');
            const shapeClasses = ['shape-circle', 'shape-square', 'shape-rounded', 'shape-triangle'];
            b.classList.add(shapeClasses[cfg.shape] || 'shape-circle');

            const alpha = typeof cfg.alpha === 'number' ? cfg.alpha : 0.92;
            const scale = typeof cfg.scale === 'number' ? cfg.scale : 1.0;
            b.style.opacity = String(Math.max(0.2, Math.min(1, alpha)));
            b.style.transform = `scale(${Math.max(0.5, Math.min(1.5, scale))})`;

            if (cfg.shape === 3) {
                b.style.background = 'transparent';
                b.style.borderBottomColor = cfg.customHex || '#22D3EE';
            } else if (cfg.customHex) {
                b.style.background = cfg.customHex;
            } else {
                b.style.background = 'linear-gradient(135deg, #22D3EE 0%, #7C3AED 100%)';
            }
        }

        function show() {
            const b = bubbleEl();
            if (!b) return;
            b.classList.remove('hidden');
            ensurePositioned();
        }

        function hide() {
            const b = bubbleEl();
            const m = menuEl();
            if (b) b.classList.add('hidden');
            if (m) m.classList.add('hidden');
        }

        function positionMenuNearBubble() {
            const b = bubbleEl();
            const m = menuEl();
            if (!b || !m) return;

            ensurePositioned();
            const bRect = b.getBoundingClientRect();
            const menuW = Math.min(296, window.innerWidth - 24);
            const menuH = 260;

            let left = bRect.left + bRect.width / 2 - menuW / 2;
            left = Math.max(12, Math.min(window.innerWidth - menuW - 12, left));

            let top = bRect.top - menuH - 12;
            if (top < 12) {
                top = Math.min(window.innerHeight - menuH - 76, bRect.bottom + 12);
            }
            top = Math.max(12, top);

            m.style.width = menuW + 'px';
            m.style.left = left + 'px';
            m.style.top = top + 'px';
        }

        function openMenu() {
            const m = menuEl();
            if (!m) return;
            show();
            positionMenuNearBubble();
            m.classList.remove('hidden');
            const inp = queryInput();
            if (inp) setTimeout(() => inp.focus(), 40);
        }

        function closeMenu() {
            const m = menuEl();
            if (m) m.classList.add('hidden');
        }

        function toggleMenu() {
            const m = menuEl();
            if (!m) return;
            if (m.classList.contains('hidden')) openMenu();
            else closeMenu();
        }

        function init() {
            const b = bubbleEl();
            const m = menuEl();
            if (!b || !m) return;

            const initialCfg = Apps.bubbleSettings.getConfig();
            applyConfig(initialCfg);
            ensurePositioned();

            b.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                ensurePositioned();
                isDragging = true;
                movedDuringDrag = false;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseInt(b.style.left, 10) || 0;
                startTop = parseInt(b.style.top, 10) || 0;
                b.setPointerCapture(e.pointerId);
            });

            b.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.hypot(dx, dy) > 6) {
                    movedDuringDrag = true;
                }
                const maxX = Math.max(8, window.innerWidth - b.offsetWidth - 8);
                const maxY = Math.max(8, window.innerHeight - b.offsetHeight - 72);
                const nextX = Math.max(8, Math.min(maxX, startLeft + dx));
                const nextY = Math.max(8, Math.min(maxY, startTop + dy));
                b.style.left = nextX + 'px';
                b.style.top = nextY + 'px';
                if (!m.classList.contains('hidden')) {
                    positionMenuNearBubble();
                }
            });

            b.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                try { b.releasePointerCapture(e.pointerId); } catch (err) {}
                if (!movedDuringDrag) {
                    toggleMenu();
                }
            });

            document.getElementById('fam-close-btn').addEventListener('click', closeMenu);

            document.getElementById('fam-opt-ai').addEventListener('click', () => {
                const q = (queryInput() && queryInput().value) || '';
                closeMenu();
                Apps.aiAssistant.open(q, 'ai');
            });

            document.getElementById('fam-opt-ai-explain').addEventListener('click', () => {
                const q = (queryInput() && queryInput().value) || '';
                closeMenu();
                Apps.aiAssistant.open(q, 'explain');
            });

            document.getElementById('fam-opt-google').addEventListener('click', () => {
                const q = (queryInput() && queryInput().value) || '';
                closeMenu();
                Apps.googleSearch.open(q, false);
            });

            document.getElementById('fam-opt-google-ai').addEventListener('click', () => {
                const q = (queryInput() && queryInput().value) || '';
                closeMenu();
                Apps.googleSearch.open(q, true);
            });

            document.getElementById('fam-opt-settings').addEventListener('click', () => {
                closeMenu();
                Apps.bubbleSettings.open();
            });

            document.getElementById('fam-opt-hide').addEventListener('click', () => {
                const cfg = Apps.bubbleSettings.getConfig();
                cfg.visible = false;
                Apps.bubbleSettings.saveConfig(cfg);
                hide();
                notify('Bubble disembunyikan. Klik ikon bubble di taskbar untuk memunculkan lagi.');
            });

            if (queryInput()) {
                queryInput().addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const q = queryInput().value;
                        closeMenu();
                        Apps.aiAssistant.open(q, 'ai');
                    }
                });
            }

            document.addEventListener('click', (e) => {
                if (!m.classList.contains('hidden') && !m.contains(e.target) && !b.contains(e.target)) {
                    closeMenu();
                }
            });

            window.addEventListener('resize', () => {
                ensurePositioned();
                const rect = b.getBoundingClientRect();
                const maxX = Math.max(8, window.innerWidth - b.offsetWidth - 8);
                const maxY = Math.max(8, window.innerHeight - b.offsetHeight - 72);
                b.style.left = Math.max(8, Math.min(maxX, rect.left)) + 'px';
                b.style.top = Math.max(8, Math.min(maxY, rect.top)) + 'px';
                if (!m.classList.contains('hidden')) positionMenuNearBubble();
            });
        }

        return { init, applyConfig, show, hide, openMenu, closeMenu, toggleMenu };
    })();

    /* ---------- Helpers ---------- */
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
        return String(str).replace(/"/g, '&quot;');
    }

    /* ---------- Boot & Desktop Initialization ---------- */
    function updateClock() {
        const now = new Date();
        const tEl = document.getElementById('taskbar-time-text');
        const dEl = document.getElementById('taskbar-date-text');
        if (tEl) tEl.textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
        if (dEl) dEl.textContent = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function boot() {
        updateClock();
        setInterval(updateClock, 1000);

        document.querySelectorAll('.desktop-icon, .start-app').forEach(el => {
            el.addEventListener('click', () => {
                const appId = el.dataset.app;
                if (window.AppRegistry && window.AppRegistry[appId]) {
                    window.AppRegistry[appId].open();
                }
                const sm = document.getElementById('start-menu');
                if (sm) sm.classList.add('hidden');
            });
        });

        const searchInput = document.getElementById('start-search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim().toLowerCase();
                document.querySelectorAll('#start-menu .start-app').forEach(appEl => {
                    const label = (appEl.textContent + ' ' + (appEl.dataset.name || '')).toLowerCase();
                    appEl.classList.toggle('hidden', Boolean(term) && !label.includes(term));
                });
            });
        }

        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!startMenu.classList.contains('hidden') && !startMenu.contains(e.target) && !startBtn.contains(e.target)) {
                startMenu.classList.add('hidden');
            }
        });

        document.getElementById('taskbar-bubble-btn').addEventListener('click', () => {
            const cfg = Apps.bubbleSettings.getConfig();
            cfg.visible = true;
            Apps.bubbleSettings.saveConfig(cfg);
            FloatingBubbleController.toggleMenu();
        });

        document.getElementById('taskbar-settings-btn').addEventListener('click', () => Apps.bubbleSettings.open());

        const closeBtn = document.getElementById('taskbar-close-btn');
        WindowManager.on('focus', (id) => closeBtn.classList.toggle('hidden', !id));
        closeBtn.addEventListener('click', () => {
            const id = WindowManager.activeId();
            if (id) WindowManager.close(id);
        });

        document.getElementById('start-power-btn').addEventListener('click', () => {
            if (confirm('Tutup semua jendela aplikasi?')) {
                WindowManager.closeAll();
                FloatingBubbleController.closeMenu();
                startMenu.classList.add('hidden');
            }
        });

        FloatingBubbleController.init();

        setTimeout(() => {
            const bootScreen = document.getElementById('boot-screen');
            if (bootScreen) {
                bootScreen.classList.add('fade-out');
                setTimeout(() => {
                    bootScreen.remove();
                    const desk = document.getElementById('desktop');
                    if (desk) desk.classList.remove('hidden');
                    FloatingBubbleController.show();
                }, 450);
            }
        }, 700);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
    </script>
